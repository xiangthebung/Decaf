<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Decaf</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <p class="brand">Decaf</p>
        <label class="switch">
          <span class="switch-label" id="master-state">On</span>
          <input id="master" type="checkbox" aria-label="Turn Decaf on">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </header>

      <section id="site-card" class="card" aria-labelledby="site-name">
        <div class="row">
          <h1 id="site-name">Site</h1>
          <span id="site-badge" class="badge">Off</span>
        </div>
        <p id="site-detail" class="detail"></p>
        <button id="site-enable" class="button primary" type="button" hidden>Turn on here</button>
        <div id="pass-row" class="pass" hidden>
          <span id="pass-time">Feed open</span>
          <button id="pass-end" class="button quiet" type="button">Pause it again</button>
        </div>
      </section>

      <p id="unsupported" class="empty" hidden>Decaf works on 12 feed-driven sites. Open one to see it here.</p>

      <section id="lock-card" class="card" aria-labelledby="lock-title">
        <h2 id="lock-title">Lock</h2>
        <p id="lock-detail" class="detail">Holds every Decaf setting in place until it ends.</p>
        <div id="lock-choices" class="segmented" role="radiogroup" aria-label="Lock duration"></div>
        <button id="lock-button" class="button primary" type="button">Lock</button>
        <button id="lock-cancel" class="button quiet" type="button" hidden>Cancel</button>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <button id="settings" class="button quiet wide" type="button">Settings</button>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
